<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBI ATM | Dashboard</title>
    <!-- Fonts and Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">
    <!-- CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container" style="max-width: 800px;">
        <div class="glass-card large">
            
            <div class="dashboard-header">
                <div class="logo"><i class="ph ph-bank"></i> State Bank Of India</div>
                <div class="user-info">
                    <h2 id="userName">Welcome, User</h2>
                    <p class="account-number" id="maskedAccount">XXXX-XXXX-XXXX</p>
                </div>
            </div>

            <div class="balance-card">
                <div class="balance-label">Available Balance</div>
                <div class="balance-amount" id="displayBalance">₹0.00</div>
                <div class="date-time" id="dateTime">--</div>
            </div>

            <div class="atm-grid">
                <a href="balance.html" class="action-card">
                    <i class="ph ph-wallet"></i>
                    <span>Balance Enquiry</span>
                </a>
                <a href="withdrawal.html" class="action-card">
                    <i class="ph ph-money"></i>
                    <span>Cash Withdrawal</span>
                </a>
                <a href="deposit.html" class="action-card">
                    <i class="ph ph-hand-coins"></i>
                    <span>Cash Deposit</span>
                </a>
                <a href="transfer.html" class="action-card">
                    <i class="ph ph-arrows-left-right"></i>
                    <span>Fund Transfer</span>
                </a>
                <a href="statement.html" class="action-card">
                    <i class="ph ph-list-dashes"></i>
                    <span>Mini Statement</span>
                </a>
                <a href="analysis.html" class="action-card">
                    <i class="ph ph-chart-pie-slice"></i>
                    <span>Analytics & Stats</span>
                </a>
                <a href="change-pin.html" class="action-card">
                    <i class="ph ph-lock-key"></i>
                    <span>Change PIN</span>
                </a>
            </div>

            <button id="logoutBtn" class="btn btn-danger" style="max-width: 200px; margin: 0 auto;">
                <i class="ph ph-sign-out"></i> End Session
            </button>

        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
