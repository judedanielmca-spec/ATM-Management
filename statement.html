<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBI ATM | Mini Statement</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container" style="max-width: 800px;">
        <div class="top-nav">
            <a href="dashboard.html" class="back-btn">
                <i class="ph ph-arrow-left"></i> Back to Dashboard
            </a>
        </div>
        
        <div class="glass-card large">
            <h2>Mini Statement</h2>
            <p class="subtitle">Your last 10 transactions</p>
            
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Date & Time</th>
                            <th>Description</th>
                            <th>Type</th>
                            <th>Amount</th>
                        </tr>
                    </thead>
                    <tbody id="statementBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
            
            <button class="btn btn-secondary" onclick="window.print()" style="max-width: 200px; margin: 2rem auto 0;">
                <i class="ph ph-printer"></i> Print Statement
            </button>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/transactions.js"></script>
</body>
</html>
