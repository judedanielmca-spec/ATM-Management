<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SBI ATM | Deposit</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <div class="top-nav">
            <a href="dashboard.html" class="back-btn">
                <i class="ph ph-arrow-left"></i> Back to Dashboard
            </a>
        </div>
        
        <div class="glass-card">
            <h2>Cash Deposit</h2>
            <p class="subtitle">Insert cash in the machine slot below</p>
            
            <div style="font-size: 3rem; color: var(--text-muted); margin-bottom: 2rem;">
                <i class="ph ph-currency-inr"></i>
            </div>

            <form id="depositForm">
                <div class="form-group">
                    <label for="depositAmount">Deposit Amount (Multiples of ₹100)</label>
                    <input type="number" id="depositAmount" class="input-field" placeholder="Enter deposit amount" min="100" step="100" required>
                </div>
                <button type="submit" class="btn btn-primary">Confirm Deposit</button>
            </form>
        </div>
    </div>

    <div id="toast"></div>

    <!-- Scripts -->
    <script src="js/auth.js"></script>
    <script src="js/transactions.js"></script>
</body>
</html>
